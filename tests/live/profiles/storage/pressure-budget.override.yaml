# db-size and cleanup-faults run on the full profile's shared state volume,
# where earlier phases leave ~3.4 MB that log trimming cannot reclaim. Under
# the 5/3 MiB budget the recovery target sits below that floor, so self-trim
# deletes every deletable log row (the newest included) and recovery to the
# target may never happen. This budget keeps the recovery target well above
# the floor, while one fixture copy (db-size) and a 2x refill (cleanup-faults)
# still overshoot the trigger.
services:
  candidate:
    environment:
      CORTEX_MAX_DB_SIZE_MB: "12"
      CORTEX_RECOVERY_DB_SIZE_MB: "8"
