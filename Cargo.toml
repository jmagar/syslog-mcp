[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
authors = ["dinglebear.ai <hello@dinglebear.ai>"]
license = "AGPL-3.0-only"
readme = "README.md"
homepage = "https://cortex.dinglebear.ai"
repository = "https://github.com/dinglebear-ai/cortex"

[workspace.dependencies]
rmcp = { version = "=3.1.0", default-features = false }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"
redundant_explicit_links = "warn"
missing_crate_level_docs = "deny"

[workspace.lints.rust]
missing_docs = "allow"
# fleet-contract@fleet-2026-07-31 still requires this legacy lint key. Keep the
# real Rustdoc lint above and suppress only the compiler diagnostic emitted for
# carrying this compatibility alias. Remove both lines when the fleet contract
# accepts workspace.lints.rustdoc.missing_crate_level_docs.
missing_crate_level_docs = "deny"
renamed_and_removed_lints = "allow"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
mod_module_files = "deny"
missing_safety_doc = "deny"

[package]
name = "cortex"
version = "3.15.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "development-tools::debugging", "database", "network-programming", "parsing"]
keywords = ["mcp", "logs", "syslog", "observability", "homelab"]
description = "Self-hosted homelab log intelligence over MCP, CLI, and REST with SQLite/FTS."
publish = false
autobins = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
# Async runtime
# Explicit feature list instead of "full" — keeps the dependency surface
# auditable (full-review BM5).
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "signal",
  "process",
  "fs",
  "io-util",
  "io-std",
] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP / MCP transport
axum = "0.8"
# Declared bound matches what Cargo.lock actually resolves (1.7.x) so docs,
# lockfile, and code agree (full-review BM2).
rmcp = { workspace = true, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "transport-io",
] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }

# SQLite
rusqlite = { version = "0.39", features = ["bundled", "vtab", "backup", "hooks"] }
parking_lot = "0.12"
r2d2 = "0.8"
r2d2_sqlite = "0.33"
scheduled-thread-pool = "0.2"

# Syslog parsing
syslog_loose = "0.21"

# Docker Engine API client for optional docker-socket-proxy ingestion
bollard = { version = "0.19", default-features = false, features = [
  "http",
  "pipe",
  "chrono",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Query-string serializer/deserializer that handles `Vec<String>` from repeated
# `?terms[]=a&terms[]=b` params (and `terms=a&terms=b`), unlike the default
# `serde_urlencoded` axum 0.8 wires into `Query<T>`. Used by the axum extractor
# on `GET /api/ai/abuse` so the wire shape matches `AbuseSearchRequest`
# directly (bead 0p8r.15). The reqwest client also uses it to serialize the
# same request via `Url::query_pairs_mut` so both ends share the type.
serde_qs = { version = "1.0", features = ["axum"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"
toml_edit = "0.22"

# OAuth + JWT (shared with lab via parameterizable lab-auth crate)
lab-auth = { git = "https://github.com/dinglebear-ai/labby.git", rev = "87cec3241f9baef22335de9cc8629ebbcd8ba047", package = "lab-auth" }
url = "2"

# Errors
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI output

# Utils
anyhow = "1"
lru = "0.18.2"
ipnet = "2.12"
tempfile = "3"
regex = "1"
sha2 = "0.10"
getrandom = "0.4"
hmac = "0.12"

futures-util = "0.3"
async-stream = "0.3"
hex = "0.4"

# HTTP client for Apprise notifications and CLI REST routing (bead 0p8r.5).
# NOTE: default-features=false omits gzip/brotli/deflate decompression — fine
# for loopback `/api/*` calls. If the CLI ever points at a reverse proxy that
# gzips responses, parsing will silently break; re-enable the relevant feature.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }

# CLI HTTP client: surfaces field path + preview when responses don't match
# Response struct shape (bead 0p8r.5).
serde_path_to_error = "0.1"

# OTLP HTTP receiver — message types only, no gRPC transport
opentelemetry-proto = { version = "0.32", default-features = false, features = [
  "gen-tonic-messages",
  "logs",
  "metrics",
  "trace",
] }
prost = "0.14"
notify = "8.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true

[features]
test-support = []

# Release profile for a deployed long-running daemon + the bundled plugin
# binary (full-review BM4). `panic = "abort"` is deliberately NOT set:
# run_db recovers DB-task panics via JoinError::is_panic.
# CI compiles this workspace from scratch constantly (CARGO_INCREMENTAL=0 is
# required under the kache rustc-wrapper), and full DWARF is a large share of
# that time. "line-tables-only" keeps file/line in panics and backtraces --
# what CI output is actually read for -- while skipping the type/variable
# debuginfo only an interactive debugger uses. Matches labby.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "symbols"

# Faster local/dev release builds: skip LTO and parallelize codegen. Trades a
# little runtime perf + binary size for much shorter compile times. Used by
# `just sync-container` for the local-binary + container refresh loop.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[dev-dependencies]
cortex = { path = ".", features = ["test-support"] }
serial_test = "3"
# test-util enables tokio::test(start_paused) for the listener-supervision
# tests so backoff sleeps advance instantly instead of in real time.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
rmcp = { workspace = true, features = [
  "client",
  "transport-child-process",
] }
# Mock HTTP server for CLI HTTP client tests (bead 0p8r.5).
wiremock = "0.6"
tracing-test = "0.2"
filetime = "0.2"
