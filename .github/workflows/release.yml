name: release

# Triggered when release-please merges a release PR and pushes the resulting
# version tag (e.g. v1.16.1) — see .github/workflows/release-please.yml.
# Builds cortex for Linux + Windows, packages with SHA256 checksums, and
# attaches the artifacts to the GitHub Release release-please already created
# for that tag.
#
# Manual workflow_dispatch defaults to a dry-run that builds everything but skips
# artifact attachment. Pass publish=true only when intentionally publishing
# from an already-tagged ref.
#
# NOTE: cortex uses target-dir = ".cache/cargo" in .cargo/config.toml so all
# artifact paths use .cache/cargo/release/ instead of target/release/.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release for the tagged ref instead of dry-run only"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # required to create releases

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  cortex-linux:
    name: build cortex (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}

      - name: cargo build --release --bin cortex
        run: cargo build --release --locked --bin cortex

      - name: Package
        run: |
          set -euo pipefail
          cd .cache/cargo/release
          tar -czf cortex-linux-x86_64.tar.gz cortex
          sha256sum cortex-linux-x86_64.tar.gz > cortex-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-linux-x86_64
          path: |
            .cache/cargo/release/cortex-linux-x86_64.tar.gz
            .cache/cargo/release/cortex-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  cortex-windows:
    name: build cortex (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-cortex-windows
          cache-directories: .cache/cargo

      - name: cargo build --release --bin cortex
        run: cargo build --release --locked --bin cortex

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location .cache/cargo/release
          Copy-Item cortex.exe cortex-windows-x86_64.exe
          $binaryHash = (Get-FileHash cortex-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$binaryHash  cortex-windows-x86_64.exe" | Out-File -Encoding ascii cortex-windows-x86_64.exe.sha256
          Compress-Archive -Path cortex.exe -DestinationPath cortex-windows-x86_64.zip -Force
          $hash = (Get-FileHash cortex-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  cortex-windows-x86_64.zip" | Out-File -Encoding ascii cortex-windows-x86_64.zip.sha256
          Pop-Location

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cortex-windows-x86_64
          path: |
            .cache/cargo/release/cortex-windows-x86_64.zip
            .cache/cargo/release/cortex-windows-x86_64.zip.sha256
            .cache/cargo/release/cortex-windows-x86_64.exe
            .cache/cargo/release/cortex-windows-x86_64.exe.sha256
          if-no-files-found: error

  live-candidate-image:
    name: build live candidate once
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build and record candidate digest
        run: |
          docker build --pull=false -f config/Dockerfile -t cortex-live-release-candidate .
          docker image inspect cortex-live-release-candidate --format '{{.Id}}' > candidate-image.digest
          docker save cortex-live-release-candidate | gzip -1 > candidate-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-candidate-image
          path: |
            candidate-image.tar.gz
            candidate-image.digest
          if-no-files-found: error
          retention-days: 1

  live-release-gate:
    name: live release gate (${{ matrix.profile }})
    needs: [cortex-linux, cortex-windows, live-candidate-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [full, auth, stateful, notifications, upgrade, security, mutation]
    env:
      LIVE_RUNS_ROOT: ${{ github.workspace }}/.live-runs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: live-candidate-image
          path: candidate-image
      - name: Load exact shared candidate
        run: |
          gunzip -c candidate-image/candidate-image.tar.gz | docker load
          test "$(docker image inspect cortex-live-release-candidate --format '{{.Id}}')" = "$(cat candidate-image/candidate-image.digest)"
          echo "LIVE_CANDIDATE_IMAGE_REF=cortex-live-release-candidate" >> "$GITHUB_ENV"
      - name: Require Docker infrastructure
        run: docker info >/dev/null && docker compose version >/dev/null
      - name: Sweep expired exact-identity leases
        run: |
          provider="docker-host:$(docker info --format '{{.ID}}')"
          bash tests/live/runner.sh --janitor --runs-root "$LIVE_RUNS_ROOT" --provider "$provider"
      - name: Run release-blocking profile
        run: bash tests/live/run-profile.sh "${{ matrix.profile }}"
      - name: Reconcile leases
        if: always()
        run: |
          provider="docker-host:$(docker info --format '{{.ID}}')"
          bash tests/live/runner.sh --janitor --runs-root "$LIVE_RUNS_ROOT" --provider "$provider"
      - name: Sanitize result artifacts
        if: always()
        run: bash scripts/ci/prepare-live-artifacts.sh "$LIVE_RUNS_ROOT" live-upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-live-${{ matrix.profile }}-${{ github.run_id }}
          path: live-upload
          if-no-files-found: error

  package-release-gate:
    name: package qualification
    needs: [cortex-linux, cortex-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIVE_RUNS_ROOT: ${{ github.workspace }}/.live-runs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cortex-linux-x86_64
          path: candidate
      - name: Create pinned candidate manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="$GITHUB_WORKSPACE/candidate/cortex-linux-x86_64.tar.gz"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          jq -n --arg version "$version" --arg archive "$archive" --arg digest "$digest" \
            '{schema:"cortex-live-artifact-manifest-v1",release:$version,artifacts:[{name:"cortex-linux-x86_64",kind:"archive",origin:("file://"+$archive),path:$archive,sha256:$digest,platform:"linux-amd64"}]}' > candidate-manifest.json
          echo "LIVE_ARTIFACT_MANIFEST=$GITHUB_WORKSPACE/candidate-manifest.json" >> "$GITHUB_ENV"
      - name: Qualify exact package
        run: bash tests/live/run-profile.sh artifact
      - name: Reconcile leases
        if: always()
        run: bash tests/live/runner.sh --janitor --runs-root "$LIVE_RUNS_ROOT" --provider "local:$GITHUB_WORKSPACE"
      - name: Sanitize result artifacts
        if: always()
        run: bash scripts/ci/prepare-live-artifacts.sh "$LIVE_RUNS_ROOT" live-upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-package-${{ github.run_id }}
          path: live-upload
          if-no-files-found: error

  publish:
    name: publish github release
    needs: [cortex-linux, cortex-windows, live-release-gate, package-release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Tag pushes publish automatically. workflow_dispatch stays dry-run unless
    # a human explicitly passes publish=true on a tagged ref.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.publish == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      # release-please already created the GitHub Release for this tag (with
      # its own changelog-derived notes) before this workflow's push-tag
      # trigger fired. Deliberately omit generate_release_notes here — it
      # would overwrite that body with GitHub's generic auto-generated notes.
      # This step only attaches the built artifacts to the existing release
      # (or creates one, for a manual workflow_dispatch on an untagged ref).
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/cortex-linux-x86_64.tar.gz
            dist/cortex-linux-x86_64.tar.gz.sha256
            dist/cortex-windows-x86_64.zip
            dist/cortex-windows-x86_64.zip.sha256
            dist/cortex-windows-x86_64.exe
            dist/cortex-windows-x86_64.exe.sha256
          fail_on_unmatched_files: true

  npm:
    name: publish npm launcher
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.publish == 'true')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate npm publication identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami >/dev/null

      - name: Verify npm package version matches release tag
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="$(node -p "require('./packages/cortex-rmcp/package.json').version")"
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::release tag ${tag} does not match packages/cortex-rmcp/package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test npm launcher
        run: npm test --prefix packages/cortex-rmcp
      - name: Check npm launcher syntax
        run: npm run check --prefix packages/cortex-rmcp
      - name: Dry-run npm package
        run: npm pack --dry-run --json ./packages/cortex-rmcp

      - name: Check whether npm version is already published
        id: published
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@dinglebear/cortex@${{ steps.npm-version.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public ./packages/cortex-rmcp

      - name: Smoke published npm launcher
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.npm-version.outputs.version }}"
          package="@dinglebear/cortex@${version}"
          for attempt in {1..18}; do
            cache="$(mktemp -d)"
            if npm view "$package" version >/dev/null 2>&1 && npm_config_cache="$cache" npx -y "$package" --version; then
              rm -rf "$cache"
              exit 0
            fi
            rm -rf "$cache"
            if [[ "$attempt" == "18" ]]; then
              npm view "$package" version
              npm_config_cache="$(mktemp -d)" npx -y "$package" --version
              exit 1
            fi
            sleep 10
          done
